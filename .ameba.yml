# Ameba configuration. Each exclusion says why it exists.

Lint/SpecFilename:
  Excluded:
    # Compile-only probes run by scripts/compile_api_card_probes.sh; they are
    # not specs.
    - spec/api_card_probes/**
    # Shared setup that the Grant specs require; it holds no examples.
    - spec/grant_helper.cr

Lint/UselessAssign:
  Excluded:
    # Each probe assigns a typed local to prove what the API returns.
    - spec/api_card_probes/**
