name: gemma
version: 0.6.5
description: |
  File Attachment toolkit for Crystal applications

authors:
  - Igor Alexandrov <igor.alexandrov@gmail.com>
  - Mick Wout <wout@mick-wout.com>
  - Amber Team and Contributors <amberframework.org>

crystal: ">= 1.0.0, < 2.0.0"

license: MIT

dependencies:
  awscr-s3:
    github: taylorfinnell/awscr-s3
    commit: 0f6e488
  content_disposition:
    github: jetrockets/content_disposition.cr
    version: ~> 1.2.0
  habitat:
    github: luckyframework/habitat
    version: ~> 0.4.7

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    # Crystal 1.21 compatibility (Ameba 1.7.0-dev); the same commit Grant uses.
    commit: cdd58b34b0d8a9c785d67183a7a8f07541549e55
  fastimage:
    github: jetrockets/fastimage.cr
    version: ~> 1.2.1
  spectator:
    gitlab: arctic-fox/spectator
    version: ~> 0.11.6
  webmock:
    github: manastech/webmock.cr
    version: 0.14.0
  grant:
    github: crimson-knight/grant
    commit: da1e06161148f156dbce262a4a4efcb39cba5ba4
  sqlite3:
    github: crystal-lang/crystal-sqlite3
    # Matches Grant's driver; 0.23.0 resolves against db 0.14.
    version: "0.23.0"
