card_version: 1
library: gemma
applies_to: "~> 0.7.0"
docs_entries:
  - src/gemma.cr
  - src/gemma/grant.cr
notes:
  - symbol: Gemma::Grant::Attachable.has_one_attached
    text: "Require gemma/grant and include Gemma::Grant::Attachable in a Grant model. has_one_attached declares a nilable Gemma::UploadedFile <name>_data column (TEXT, Gemma::Grant::AttachmentConverter); do not declare it yourself, then adds a nilable UploadedFile getter, a URL method, and save/destroy hooks."
  - symbol: Gemma::Grant::Attachable.has_many_attached
    text: "has_many_attached declares a nilable Array(Gemma::UploadedFile) <name>_data column (TEXT, Gemma::Grant::AttachmentListConverter). It adds an UploadedFile array getter, add/remove/clear helpers, and save/destroy hooks."
  - symbol: Gemma::Attacher#attach_cached
    text: "Gemma::Attacher#attach_cached(io) uploads an IO to the cache storage. #attach(io, storage = store_key) returns Gemma::UploadedFile | Nil, and #file is nilable until an upload is attached."
  - symbol: Gemma::UploadedFile#url
    text: "Gemma::UploadedFile.new(id, storage_key, metadata) creates the attachment value. #url(**options) returns String, #storage returns Gemma::Storage::Base, and #metadata returns a typed Gemma::Metadata (size, mime_type, width, height, filename, extra); #to_json writes the stored JSON."
  - symbol: Gemma::Storage::Base#open
    text: "A storage adapter implements open(id : String, **options) : IO, url(id, **options) : String, exists?(id) : Bool, plus upload, delete, and clean. Gemma::Storage::Memory is a built-in adapter for this interface."
  - symbol: Gemma.configure
    text: "Register named adapters in Gemma.configure through config.storages, a Hash(String, Gemma::Storage::Base). Gemma.upload(io, storage, **options) returns Gemma::UploadedFile."
  - symbol: Gemma::Storage::S3::Client
    text: "Gemma::Storage::S3::Client.new(region, aws_access_key, aws_secret_key, endpoint : String? = nil, addressing_style : AddressingStyle? = nil) replaces Awscr::S3::Client; no require \"awscr-s3\". Addressing defaults to :virtual_hosted for AWS and DigitalOcean Spaces, :path for other endpoints. Failures raise Gemma::Storage::S3::ResponseError (status_code, response_body)."
