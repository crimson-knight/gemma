name: specs

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 3 AM

jobs:
  specs:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build the pinned toolchain image
        run: docker build --file ci/Dockerfile --tag gemma-ci .

      - name: Install dependencies from the committed lock
        run: docker run --rm -v "$PWD":/app gemma-ci minecart install --frozen --skip-postinstall --skip-ai-docs --skip-ai-assistant

      - name: Run specs
        run: docker run --rm -v "$PWD":/app gemma-ci crystal-alpha spec

      - name: Start MinIO
        # Pinned by digest: MinIO RELEASE.2026-10-23T20-06-51Z (Chainguard build).
        run: |
          docker run -d --name gemma-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=gemma-spec -e MINIO_ROOT_PASSWORD=gemma-spec-secret \
            cgr.dev/chainguard/minio@sha256:73297936408b731668ca0e835ac9add1a35cb6026a125c2f0cd476d9ef48222c \
            server /data
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs gemma-minio
          exit 1

      - name: Run S3 round-trip specs against MinIO
        run: |
          docker run --rm --network host -v "$PWD":/app \
            -e GEMMA_S3_TEST_ENDPOINT -e GEMMA_S3_TEST_ACCESS_KEY -e GEMMA_S3_TEST_SECRET_KEY \
            gemma-ci crystal-alpha spec spec/gemma/storage/s3_minio_spec.cr
        env:
          GEMMA_S3_TEST_ENDPOINT: http://localhost:9000
          GEMMA_S3_TEST_ACCESS_KEY: gemma-spec # secret-scan-gate:allow (local MinIO test credential)
          GEMMA_S3_TEST_SECRET_KEY: gemma-spec-secret # secret-scan-gate:allow (local MinIO test credential)
