name: docs

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  generate-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build the pinned toolchain image
        run: docker build --file ci/Dockerfile --tag gemma-ci .

      - name: Install dependencies from the committed lock
        # `src/gemma/grant.cr` requires Grant, a development dependency, so
        # the docs build needs the locked shards in lib/.
        run: docker run --rm -v "$PWD":/app gemma-ci minecart install --frozen --skip-postinstall --skip-ai-docs --skip-ai-assistant

      - name: Generate
        run: docker run --rm -v "$PWD":/app gemma-ci crystal-alpha docs

      - name: Deploy
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@6c2d9db40f9296374acc17b90404b6e8864128c8 # v4.7.3
        with:
          branch: gh-pages
          folder: docs
