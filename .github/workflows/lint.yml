name: lint

on:
  push:
    branches:
    - master
  pull_request:

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # crystal: [latest, nightly]
        crystal: [latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install Crystal
        uses: oprypin/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Checkout
        uses: actions/checkout@v2

      - name: Install dependencies
        run: shards install
        env:
          SHARDS_OPTS: --ignore-crystal-version

      - name: Check formatting
        run: crystal tool format --check

      - name: Build Ameba
        # Ameba 1.7 installs no bin/ameba; build it from the pinned source.
        run: mkdir -p bin && crystal build lib/ameba/src/cli.cr -o bin/ameba

      - name: Run Ameba
        run: ./bin/ameba