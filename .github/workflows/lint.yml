name: lint

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build the pinned toolchain image
        run: docker build --file ci/Dockerfile --tag gemma-ci .

      - name: Install dependencies from the committed lock
        run: docker run --rm -v "$PWD":/app gemma-ci minecart install --frozen --skip-postinstall --skip-ai-docs --skip-ai-assistant

      - name: Check formatting
        run: docker run --rm -v "$PWD":/app gemma-ci crystal-alpha tool format --check src spec

      - name: Run Ameba
        # Ameba 1.7 installs no bin/ameba; build it from the pinned source.
        # Reports without failing until the hygiene PR brings the count to 0.
        continue-on-error: true
        run: docker run --rm -v "$PWD":/app gemma-ci sh -c 'mkdir -p bin && crystal-alpha build lib/ameba/src/cli.cr -o bin/ameba && bin/ameba src spec'
